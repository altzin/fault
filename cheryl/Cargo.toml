[package]
name = "cheryl"
version = "0.1.0"
edition = "2024"


[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full", "io-util", "rt-multi-thread"] }
opentelemetry = "=0.32.0"
opentelemetry_sdk = { version = "0.32", features = ["logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "=0.33.0"
dotenvy = "0.15.7"
# tower = "0.5.3"
tower-http = {version = "0.7.1", features = [
	"cors",
	"timeout",
	"trace",
	"limit"
]}
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
sqlx = {version="0.9.0", features = ["runtime-tokio","postgres","uuid","macros","chrono"]}
uuid = {version="1.26.1", features = ["v4","serde"]}
serde = {version="1.0.229",features = ["derive"]}
opentelemetry-appender-tracing = "0.32.0"
chrono = { version = "0.4.45", features = ["serde"] }
async-nats = "0.50.0"
serde_json = "1.0.151"
